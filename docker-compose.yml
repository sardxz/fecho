# ATENÇÃO: este compose é só pra DESENVOLVIMENTO LOCAL. As credenciais abaixo
# são fracas de propósito (facilitar o setup) e as portas ficam expostas na sua
# máquina. Para produção use o docker-compose.prod.yml + .env (ver DEPLOY.md).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fecho
      POSTGRES_PASSWORD: fecho
      POSTGRES_DB: fecho
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
