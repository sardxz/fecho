# Reverse proxy do Nginx (host) pro container do Next (127.0.0.1:3000).
#
# Instalação na VPS:
#   sudo cp deploy/nginx/fechoapp.conf /etc/nginx/sites-available/fechoapp
#   sudo ln -s /etc/nginx/sites-available/fechoapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois, o HTTPS (Let's Encrypt) é adicionado automaticamente por:
#   sudo certbot --nginx -d fechoapp.com.br -d www.fechoapp.com.br
# O certbot edita este arquivo, cria o bloco 443 e redireciona 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name fechoapp.com.br www.fechoapp.com.br;

    # Upload de comprovante pode chegar a ~6 MB (validado em 5 MB na app).
    # O default do Nginx é 1 MB e bloquearia o envio.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Auth.js (atrás de proxy) usa estes headers pra montar URLs corretas.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSocket / streaming, se necessário.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
