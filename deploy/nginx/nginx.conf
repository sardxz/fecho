# nginx.conf principal (mínimo) pra VPS que roda o Fechô. Os server blocks
# ficam em sites-enabled (ver app.conf e, opcionalmente, analytics.conf).
#
# Instalação na VPS:
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak   # backup
#   sudo cp deploy/nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo cp deploy/nginx/app.conf  /etc/nginx/sites-enabled/fecho.conf
#   sudo nginx -t && sudo systemctl reload nginx

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Não revela a versão do Nginx nos headers/erros.
    server_tokens off;

    # Logs padrão.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Carrega os server blocks (o do Fechô vem daqui).
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
