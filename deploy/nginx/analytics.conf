# Reverse proxy pro Umami (analytics self-hosted), container em 127.0.0.1:3001.
# Opcional — só instale se for usar o serviço `umami` do docker-compose.prod.yml.
#
# Antes de instalar, troque `SEU-DOMINIO.com.br` pelo seu domínio.
#
# Instalação na VPS:
#   sudo cp deploy/nginx/analytics.conf /etc/nginx/sites-enabled/analytics.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d analytics.SEU-DOMINIO.com.br
#
# Pré-requisito: DNS de analytics.SEU-DOMINIO.com.br apontando pra VPS.

server {
    listen 80;
    listen [::]:80;
    server_name analytics.SEU-DOMINIO.com.br;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
